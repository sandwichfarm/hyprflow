name: Deploy website to Bunny
on:
  push:
    branches: [main]
    paths:
      [
        "website/**",
        "docs/**",
        "scripts/web/**",
        "package*.json",
        ".github/workflows/deploy-website.yml",
        "artifacts/final/navigation/**",
        "artifacts/appearance/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bunny-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bunny-website
          path: dist/
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.BUNNY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bunny-website
          path: dist/
      - name: Upload site and docs, then purge CDN
        run: node scripts/web/deploy-bunny.mjs
        env:
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
          BUNNY_PUBLIC_URL: ${{ vars.BUNNY_PUBLIC_URL }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
